# Episode 1 — Part B: the Composition that turns one WebApp into a
# Namespace + Deployment + Service + ConfigMap. Pipeline mode with
# function-patch-and-transform, then function-auto-ready to mark READY
# once all composed resources are available.
apiVersion: apiextensions.crossplane.io/v2
kind: Composition
metadata:
  name: webapp-standard
spec:
  compositeTypeRef:
    apiVersion: demo.crossplane.io/v1alpha1
    kind: WebApp
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # 1. Namespace — one per WebApp, named after spec.slug
          - name: namespace
            base:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: placeholder
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.slug
                toFieldPath: metadata.name
          # 2. Deployment — podinfo, replicas from spec.replicas, image from spec.image
          - name: deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: webapp
                namespace: placeholder
                labels:
                  app.kubernetes.io/name: webapp
                  app.kubernetes.io/part-of: crossplane-demo
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: webapp
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: webapp
                      app.kubernetes.io/part-of: crossplane-demo
                  spec:
                    containers:
                      - name: webapp
                        image: ghcr.io/stefanprodan/podinfo:6.7.1
                        ports:
                          - containerPort: 9898
                        readinessProbe:
                          httpGet:
                            path: /
                            port: 9898
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.slug
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.replicas
                toFieldPath: spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.image
                toFieldPath: spec.template.spec.containers[0].image
                transforms:
                  - type: default
                    fieldPath: spec.image
                    default:
                      string: ghcr.io/stefanprodan/podinfo:6.7.1
          # 3. Service — ClusterIP exposing the Deployment
          - name: service
            base:
              apiVersion: v1
              kind: Service
              metadata:
                name: webapp
                namespace: placeholder
              spec:
                selector:
                  app.kubernetes.io/name: webapp
                ports:
                  - port: 9898
                    targetPort: 9898
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.slug
                toFieldPath: metadata.namespace
          # 4. ConfigMap — the "opinionated default" your platform injects
          - name: config
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: webapp-config
                namespace: placeholder
              data:
                platform: "crossplane-demo"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.slug
                toFieldPath: metadata.namespace
    - step: automatically-mark-ready
      functionRef:
        name: function-auto-ready
