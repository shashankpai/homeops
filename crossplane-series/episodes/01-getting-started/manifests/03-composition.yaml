# Episode 1 — Part B: the Composition that turns one WebApp into a
# Deployment + Service + ConfigMap in the WebApp's own namespace (a
# namespaced XR can only compose namespaced resources in its namespace).
# Pipeline mode with function-patch-and-transform, then function-auto-ready
# to mark READY once all composed resources are available.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webapp-standard
spec:
  compositeTypeRef:
    apiVersion: demo.crossplane.io/v1alpha1
    kind: WebApp
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # 1. Deployment — podinfo, replicas from spec.replicas, image from spec.image
          - name: deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: webapp
                labels:
                  app.kubernetes.io/name: webapp
                  app.kubernetes.io/part-of: crossplane-demo
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: webapp
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: webapp
                      app.kubernetes.io/part-of: crossplane-demo
                  spec:
                    containers:
                      - name: webapp
                        image: ghcr.io/stefanprodan/podinfo:6.7.1
                        ports:
                          - containerPort: 9898
                        readinessProbe:
                          httpGet:
                            path: /
                            port: 9898
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.replicas
                toFieldPath: spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.image
                toFieldPath: spec.template.spec.containers[0].image
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Available
                  status: "True"
          # 2. Service — ClusterIP exposing the Deployment
          - name: service
            base:
              apiVersion: v1
              kind: Service
              metadata:
                name: webapp
              spec:
                selector:
                  app.kubernetes.io/name: webapp
                ports:
                  - port: 9898
                    targetPort: 9898
            readinessChecks:
              - type: None
          # 3. ConfigMap — the "opinionated default" your platform injects
          - name: config
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: webapp-config
              data:
                platform: "crossplane-demo"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.slug
                toFieldPath: data.slug
            readinessChecks:
              - type: None
    - step: automatically-mark-ready
      functionRef:
        name: function-auto-ready
