# DeploymentRuntimeConfig — gives provider-kubernetes pods a fixed, predictable
# service account name so the RBAC binding below can reference it.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
  # Drift is detected by polling; the provider default is much slower than a
  # demo wants. 30s keeps the heal visible on camera.
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                - --poll=30s
