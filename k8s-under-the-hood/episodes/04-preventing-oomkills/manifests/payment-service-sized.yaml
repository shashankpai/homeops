# Episode 4 — Payment Service, right-sized (the fix)
#
# The same leak-capable app as Episode 1, but sized from measured data
# instead of guesswork — and made Guaranteed (requests == limits).
#
# The sizing story (shown live in the episode):
#   measured:  baseline ~25MB + held cache (legit peak ~200MB in Ep1 load)
#              → observed peak working set ~225Mi
#   headroom:  ×2 for bursts/fragmentation/deploys → ~450Mi → 512Mi limit
#   requests:  == limits (Guaranteed QoS) — this is the payment path:
#              the last line of defense against eviction (Episode 2) and
#              a hard scheduling promise for the scheduler.
#
# NOTE: for THIS app the deeper truth is that its growth is a leak — the
# honest fix is capping the app (demonstrated with /release in the demo).
# Right-sizing + the 90% alert is the safety net for LEGIT growth. The
# episode shows both paths; this manifest is the "legit load" outcome.
#
# Reuses the payment-service-code ConfigMap created by Episode 1's manifest
# (demo.sh guarantees it exists before applying this).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-sized
  namespace: shopnow
  labels:
    app: payment-service-sized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service-sized
  template:
    metadata:
      labels:
        app: payment-service-sized
    spec:
      containers:
        # Distinct container name so cAdvisor metrics separate this from
        # the bad payment-service in dashboards/queries.
        - name: payment-sized
          image: python:3.12-slim
          command: ["python", "/app/mem-hog.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            # Guaranteed QoS: requests == limits.
            # Sized from measured peak (~225Mi) × headroom → 512Mi.
            # The MemoryNearLimit alert fires at 90% (461Mi) — the safety
            # net that pages BEFORE the kernel does.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: code
          configMap:
            # Created by episodes/01-oom-killed/manifests/payment-service.yaml
            name: payment-service-code
