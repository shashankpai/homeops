- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - chrony
      - unattended-upgrades
      - qemu-guest-agent
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable guest agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ timezone }}"

- name: Resolve homelab names locally
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} HOMEOPS HOSTS"
    block: "{{ hosts_file_entries }}"

- name: Default-deny inbound
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow service ports
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ host_firewall[inventory_hostname] | default([]) }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
