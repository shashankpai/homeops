version: 1
metadata:
  name: Forgejo SSO (OIDC provider, application, groups)
entries:
  - model: authentik_core.group
    id: group_forgejo_admins
    identifiers:
      name: forgejo-admins
    attrs:
      name: forgejo-admins
      is_superuser: false

  - model: authentik_core.group
    id: group_forgejo_users
    identifiers:
      name: forgejo-users
    attrs:
      name: forgejo-users
      is_superuser: false

  - model: authentik_providers_oauth2.scopemapping
    id: scope_forgejo_groups
    identifiers:
      name: forgejo groups claim
    attrs:
      name: forgejo groups claim
      scope_name: groups
      description: Group membership for Forgejo role mapping
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider_forgejo
    identifiers:
      name: forgejo
    attrs:
      name: forgejo
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: forgejo
      client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://git.home.lab/user/oauth2/authentik/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf scope_forgejo_groups
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
    
  - model: authentik_core.application
    id: app_forgejo
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      slug: forgejo
      provider: !KeyOf provider_forgejo
      meta_launch_url: https://git.home.lab
      meta_description: Git hosting, CI and governance
